<!DOCTYPE html>
<html>

<head>

<title>HCHO Login</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="page-wrapper">


<div class="login-container">


<h1>
HCHO Monitoring System
</h1>

<input 
type="text"
id="phone"
placeholder="+91XXXXXXXXXX">



<button id="sendOTP">
Send OTP
</button>



<input
type="text"
id="otp"
placeholder="Enter OTP">



<button id="verifyOTP">
Verify OTP
</button>



<p id="message"></p>


</div>



<div id="recaptcha-container"></div>


</div>




<script type="module" src="login.js"></script>


</body>

</html>
